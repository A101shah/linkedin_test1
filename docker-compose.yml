services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

  backend:
    build: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: 300
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - redis
